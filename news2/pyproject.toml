[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2"
version = "0.1.0"
description = "국내 언론사 국제부 RSS 기반 뉴스 다이제스트"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.0",
    "pyyaml>=6.0",
    "premailer>=3.10.0",
]

[project.scripts]
news2 = "news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
